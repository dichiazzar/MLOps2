# Capas de acceso REST/GraphQL/gRPC/Streaming sobre el mismo modelo xgb_best
# del TP integrador (../MLOps1_final), más el entrenamiento federado (clase5)
# y el Data Lake (clase6).
#
# Este compose NO duplica postgres/minio/mlflow/airflow: se conecta a la red
# `mlops-net` que ya crea el docker-compose.yml de MLOps1_final y usa el MLflow
# y MinIO que ya están corriendo ahí. Levantar primero ese stack:
#
#   cd ../MLOps1_final && docker compose up -d
#
# y recién después este:
#
#   cd ../MLOps2_TP_Final && docker compose up -d --build
#
# REST no es una capa nueva: es la API que ya existía en MLOps1_final/api
# (mismo código — ver rest_service/README.md), con un Dockerfile propio solo
# para usar el predict.py de la clase 6. Se incluye acá en el puerto 8010
# (no 8000) para poder levantar las 4 capas desde este único compose sin chocar
# con el servicio `api` de MLOps1_final si ese stack también está arriba a la vez.

# Nombre fijo del proyecto: así Docker no depende del nombre de la carpeta
# (si la carpeta se renombra, los contenedores e imágenes no cambian).
name: mlops2-tp-final

# Configuración común de los servicios de aprendizaje federado (clase5).
# PARTICION (iid | no_iid) y SIGMA (ruido) se pueden cambiar al lanzar, ver README.
x-federado-env: &federado-env
  NUM_CLIENTES: "3"
  RONDAS: "20"
  EPOCAS_LOCALES: "50"
  LR: "0.01"
  PARTICION: ${PARTICION:-iid}
  SIGMA: ${SIGMA:-0}
  SERVIDOR: fl-servidor:8080

x-federado: &federado
  build:
    context: ..
    dockerfile: MLOps2_TP_Final/federated_service/Dockerfile
  image: capas-federado
  env_file:
    - ../MLOps1_final/.env
  environment: *federado-env
  restart: "no"
  networks:
    - mlops-net
  profiles:
    - federado

services:
  # --- 1. REST (clase1): mismo código que MLOps1_final/api, puerto distinto.
  #      Dockerfile propio solo para cambiar predict.py (clase 6), ver rest_service/README.md ---
  rest:
    build:
      context: ..
      dockerfile: MLOps2_TP_Final/rest_service/Dockerfile
    container_name: capas-rest
    restart: unless-stopped
    env_file:
      - ../MLOps1_final/.env
    ports:
      - "8010:8000"
    networks:
      - mlops-net

  # --- 2. GraphQL (clase2) ---
  graphql:
    build:
      context: ..
      dockerfile: MLOps2_TP_Final/graphql_service/Dockerfile
    container_name: capas-graphql
    restart: unless-stopped
    env_file:
      - ../MLOps1_final/.env
    ports:
      - "8001:8001"
    networks:
      - mlops-net

  # --- 3. gRPC (clase3) ---
  grpc:
    build:
      context: ..
      dockerfile: MLOps2_TP_Final/grpc_service/Dockerfile
    container_name: capas-grpc
    restart: unless-stopped
    env_file:
      - ../MLOps1_final/.env
    ports:
      - "50051:50051"
    networks:
      - mlops-net

  # --- 4. Streaming (clase4): broker + consumidor + productor de prueba ---
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: capas-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  streaming-consumer:
    build:
      context: ..
      dockerfile: MLOps2_TP_Final/streaming_service/Dockerfile
    container_name: capas-streaming-consumer
    restart: unless-stopped
    command: ["python", "-m", "app.consumer"]
    depends_on:
      redpanda:
        condition: service_healthy
    env_file:
      - ../MLOps1_final/.env
    networks:
      - mlops-net

  # Productor de prueba: corre una vez y termina (simula tráfico, ver punto 2 del README).
  # Disparar manualmente con: docker compose run --rm streaming-producer
  streaming-producer:
    build:
      context: ..
      dockerfile: MLOps2_TP_Final/streaming_service/Dockerfile
    container_name: capas-streaming-producer
    command: ["python", "-m", "app.producer"]
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - mlops-net
    profiles:
      - manual  # no arranca con `docker compose up`; solo con `run --rm`

  # --- 5. Aprendizaje federado (clase5): 1 servidor + 3 clientes (concesionarias) ---
  # No es una capa de acceso: es otra forma de ENTRENAR. No arranca con `docker compose up`
  # (profile "federado"); se corre a mano, ver la sección 5 del README.
  # Todos usan la misma imagen; cambia solo el comando y el número de cliente.
  fl-particionar:
    <<: *federado
    container_name: capas-fl-particionar
    command: ["python", "-m", "app.particionar"]

  fl-servidor:
    <<: *federado
    container_name: capas-fl-servidor
    command: ["python", "-m", "app.servidor"]

  fl-cliente-0:
    <<: *federado
    container_name: capas-fl-cliente-0
    command: ["python", "-m", "app.cliente"]
    environment:
      <<: *federado-env
      CLIENTE_ID: "0"
    depends_on: [fl-servidor]

  fl-cliente-1:
    <<: *federado
    container_name: capas-fl-cliente-1
    command: ["python", "-m", "app.cliente"]
    environment:
      <<: *federado-env
      CLIENTE_ID: "1"
    depends_on: [fl-servidor]

  fl-cliente-2:
    <<: *federado
    container_name: capas-fl-cliente-2
    command: ["python", "-m", "app.cliente"]
    environment:
      <<: *federado-env
      CLIENTE_ID: "2"
    depends_on: [fl-servidor]

  # --- 6. Data Lake (clase6): prepara el bucket `datalake` y la metadata del modelo ---
  # Se corre a mano (profile "lake"), una vez y después de cada entrenamiento nuevo:
  #   docker compose --profile lake run --rm lake-preparar
  lake-preparar:
    build:
      context: ..
      dockerfile: MLOps2_TP_Final/datalake/Dockerfile
    container_name: capas-lake-preparar
    restart: "no"
    env_file:
      - ../MLOps1_final/.env
    networks:
      - mlops-net
    profiles:
      - lake

networks:
  mlops-net:
    external: true
    # Nombre real que Docker Compose le da a la red de MLOps1_final: se arma como
    # "<nombre_de_carpeta>_<nombre_de_red>". Si tu carpeta no se llama exactamente
    # "MLOps1_final", correr `docker network ls` y ajustar este name.
    name: mlops1_final_mlops-net
